[package]
name = "plancktime"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "*", features = ["rt", "tokio-macros", "sync"] }
stardust-xr-fusion = "0.53.0-rc.1"
stardust-xr-asteroids = { git = "https://github.com/StardustXR/asteroids" }
glam = { version = "0.33.7", features = ["mint", "serde"] }
